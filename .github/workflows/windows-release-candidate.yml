name: Windows release candidate

on:
  push:
    branches:
      - release/2.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Build the Windows x64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $env:RUNNER_TEMP 'netswitch-publish'
          dotnet publish ./NetworkAdapterSwitcher.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-Item -LiteralPath (Join-Path $publish 'NetworkAdapterSwitcher.exe')
          if ($exe.VersionInfo.FileVersion -ne '2.1.0.0') {
            throw "Unexpected executable version $($exe.VersionInfo.FileVersion)."
          }

          $staging = Join-Path $env:RUNNER_TEMP 'netswitch-unsigned'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $artifact = Join-Path $staging 'NetSwitchPro-2.1.0.exe'
          Copy-Item -LiteralPath $exe.FullName -Destination $artifact
          Get-FileHash -LiteralPath $artifact -Algorithm SHA256

      - name: Store unsigned artifact for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netswitch-pro-2.1.0-windows-x64-unsigned
          path: ${{ runner.temp }}/netswitch-unsigned/NetSwitchPro-2.1.0.exe
          if-no-files-found: error
